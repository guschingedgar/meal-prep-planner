<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly meal planner</title>
<meta name="theme-color" content="#FAC775">
<meta name="description" content="Plan a week of meals and get one shopping list.">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FAC775; --paper:#FFF8EC; --ink:#3B1F06; --ink-soft:#6B4A26;
  --coral:#F28C6B; --leaf:#B8DC8C; --lilac:#CBC5F5; --pink:#F7B8C9; --sky:#A9D4F2;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,sans-serif;
  --bw:2.5px; --r:18px; --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sun);color:var(--ink);font:500 16px/1.5 var(--body);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a{color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:36px 20px 150px}
.screen{display:none}.screen.on{display:block}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(40px,9vw,68px);line-height:.95}
h2{font-size:clamp(26px,5vw,34px);line-height:1.05}
h3{font-size:22px;line-height:1.1}
.center{text-align:center}
.lede{font-size:18px;color:var(--ink-soft);margin:16px auto 0;max-width:40ch}
.hint{color:var(--ink-soft);font-size:14px;margin:10px 0 0}

/* ---------- sections ---------- */
.block{margin:44px auto 0;max-width:560px;text-align:center}
.block>h3{margin-bottom:6px}
.block>.sub{color:var(--ink-soft);font-size:15px;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.chip{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;transition:transform .12s}
.chip[aria-pressed=true]{background:var(--leaf);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.chips.allergy .chip[aria-pressed=true]{background:var(--pink)}
.chips.time .chip[aria-pressed=true]{background:var(--sky)}
.chips.cuisine .chip[aria-pressed=true]{background:var(--lilac)}

/* people + budget */
.duo{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;text-align:left}
.panel{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel .lab{font-weight:700;font-size:15px;display:block;margin-bottom:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper button{width:46px;height:46px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--sun);font-size:24px;font-weight:700;line-height:1;padding:0}
.stepper output{font-family:var(--display);font-weight:800;font-size:40px;min-width:1.6ch;text-align:center}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.big small{font-family:var(--body);font-size:15px;font-weight:600;color:var(--ink-soft)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:var(--sun);border:var(--bw) solid var(--ink);border-radius:99px;margin:16px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--coral);border:var(--bw) solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--coral);border:var(--bw) solid var(--ink)}
.per-meal{font-size:14px;color:var(--ink-soft)}

/* slots */
.slots{display:grid;grid-template-columns:62px repeat(7,minmax(0,1fr));gap:6px;align-items:center;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.slots .d{font-size:13px;font-weight:700}
.slots .m{font-size:13px;font-weight:700;text-align:left}
.slot{height:40px;border-radius:10px;background:var(--paper);border:2px solid var(--ink);padding:0}
.slot[aria-pressed=true]{background:var(--coral)}
.slot-tools{display:flex;gap:16px;justify-content:center;margin-top:14px}
.linkbtn{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* tag input */
.tags{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;text-align:left;box-shadow:var(--shadow)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:15px}
.tag button{width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:13px;line-height:1;padding:0}
.tags input{flex:1;min-width:140px;border:0;background:transparent;padding:8px 6px;outline:none;font-weight:500}
.tags .add{border:2px solid var(--ink);background:var(--leaf);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.tags.small{box-shadow:none;margin-top:14px}
.reveal{display:none}.reveal.on{display:block}
textarea{width:100%;min-height:90px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px;resize:vertical;outline:none;box-shadow:var(--shadow)}

.err{color:#9A2A0C;font-weight:700;text-align:center;margin:18px 0 0;min-height:1.2em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--bw) solid var(--ink);border-radius:14px;padding:14px 22px;font-weight:700;font-size:17px;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;background:var(--paper)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn-main{background:var(--ink);color:var(--sun)}
.btn-coral{background:var(--coral)}
.btn:disabled{opacity:.7;cursor:progress}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:var(--bw) solid var(--ink);padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:none;z-index:10}
.dock.on{display:block}
.dock-inner{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
.dock-inner .btn{flex:1;white-space:nowrap;padding-left:14px;padding-right:14px}
.dock-inner .btn.shrink{flex:0 0 auto}
.dock-sum{flex:1 1 auto;min-width:0;font-weight:700;font-size:14px;line-height:1.2}
#dPlan{flex:0 0 auto}
.dock-sum small{display:block;font-weight:500;color:var(--ink-soft)}

/* loading */
.loading{min-height:72vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.plate{width:96px;height:96px;border-radius:50%;background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:var(--shadow);position:relative;margin-bottom:30px;animation:wobble 1.4s ease-in-out infinite}
.plate::after{content:'';position:absolute;inset:18px;border-radius:50%;border:var(--bw) dashed var(--ink)}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.loading p{color:var(--ink-soft);font-size:17px;margin:12px 0 0}

/* plan */
.meter{margin:22px auto 0;max-width:520px}
.meter-bar{height:22px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:99px;overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--leaf);border-right:var(--bw) solid var(--ink);transition:width .4s}
.meter-bar i.over{background:var(--coral)}
.meter-text{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-top:8px}
.notice{background:var(--pink);border:var(--bw) solid var(--ink);border-radius:14px;padding:12px 14px;font-weight:600;margin:18px auto 0;max-width:520px;display:none;text-align:center}
.notice.on{display:block}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:28px auto 0;max-width:440px}
.week .col{display:flex;flex-direction:column;gap:6px}
.week .dn{font-size:13px;font-weight:700;text-align:center}
.cell{aspect-ratio:1;border-radius:10px;background:var(--paper);border:2px solid var(--ink);overflow:hidden;padding:0}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell.off{visibility:hidden}
.cell.rej{background:var(--coral)}
.cell.rej img{filter:grayscale(1);opacity:.35}
.cell.empty{border-style:dashed}

.rail-wrap{margin:28px -20px 0}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;padding:6px 20px 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 min(80vw,330px);scroll-snap-align:start;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:22px;overflow:hidden;position:relative;box-shadow:var(--shadow);transition:transform .25s}
.photo{position:relative;aspect-ratio:4/3.2;background:var(--coral);border-bottom:var(--bw) solid var(--ink)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s}
.slot-name{position:absolute;right:12px;bottom:12px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
.x{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:2;padding:0;box-shadow:2px 2px 0 var(--ink)}
.x svg{width:18px;height:18px}
.card-body{padding:16px 16px 20px}
.card-body h4{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.facts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:3px 10px;background:var(--leaf)}
.pill.b{background:var(--lilac)}
.why{color:var(--ink-soft);font-size:15px;margin:12px 0 0}
details{margin-top:14px;border-top:2px dashed var(--ink);padding-top:10px}
summary{cursor:pointer;font-size:15px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:'+'}
details[open] summary::after{content:'–'}
details ul{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
details li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
details li span:last-child{color:var(--ink-soft)}
.recipe-link{display:inline-block;margin-top:14px;font-weight:700;text-underline-offset:3px}
.stamp{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:var(--coral);border:3px solid var(--ink);border-radius:12px;padding:6px 16px;font-family:var(--display);font-weight:800;font-size:28px;z-index:2;display:none;white-space:nowrap}
.card.rejected{transform:rotate(-2deg)}
.card.rejected .photo img{filter:grayscale(1) opacity(.5)}
.card.rejected .card-body{opacity:.5}
.card.rejected .stamp{display:block}
.card.rejected .x{background:var(--coral)}
.card.empty .photo{display:flex;align-items:center;justify-content:center;background:var(--paper);border-bottom-style:dashed}
.card.empty .photo p{font-weight:700;margin:0}
.rail-nav{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.rail-nav .count{font-weight:700}
.arrows{display:flex;gap:10px}
.round{width:46px;height:46px;border-radius:50%;background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.round svg{width:20px;height:20px}

/* list */
.aisle{margin-top:30px}
.aisle h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.aisle h3 span{font-family:var(--body);font-size:14px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;background:var(--paper)}
.items{list-style:none;margin:0;padding:0;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.items li{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:2px dashed rgba(59,31,6,.35)}
.items li:first-child{border-top:0}
.items input{appearance:none;-webkit-appearance:none;flex:0 0 26px;height:26px;border-radius:8px;border:var(--bw) solid var(--ink);margin:0;cursor:pointer;display:grid;place-content:center;background:var(--paper)}
.items input:checked{background:var(--leaf)}
.items input:checked::after{content:'';width:11px;height:6px;border:3px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.items .n{flex:1;min-width:0}
.items .n b{font-weight:700;display:block;text-transform:capitalize}
.items .n small{color:var(--ink-soft);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items .q{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
.items li.done .n b{text-decoration:line-through;opacity:.5}
.a-fruits_legumes h3 span{background:var(--leaf)}.a-viande_poisson h3 span{background:var(--pink)}
.a-cremerie h3 span{background:var(--sky)}.a-epicerie h3 span{background:var(--sun)}.a-surgele h3 span{background:var(--lilac)}
.have{margin-top:28px;text-align:center}
.have b{font-weight:800}
.list-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:32px}

/* top bar + units */
.topbar{max-width:720px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:12}
.burger{width:46px;height:46px;border-radius:14px;background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0}
.burger i{display:block;width:20px;height:2.5px;background:var(--ink);border-radius:2px}
.backdrop{position:fixed;inset:0;background:rgba(27,15,3,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
.menu{position:fixed;top:0;left:0;bottom:0;width:min(90vw,380px);background:var(--ink);color:var(--sun);
  padding:26px 26px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;
  transform:translateX(-102%);transition:transform .22s ease;z-index:21;overflow-y:auto}
.menu.on{transform:none}
.menu .brand{display:flex;align-items:center;gap:12px;margin:0 52px 22px 0}
.menu .brand img{width:46px;height:46px;border-radius:12px;border:2px solid rgba(250,199,117,.5)}
.menu .brand b{font-family:var(--display);font-weight:800;font-size:20px;color:var(--paper);line-height:1.1}
.menu .mlab{font-size:13px;font-weight:700;color:#C9B492;margin:16px 0 8px;text-transform:none}
.menu .units{display:flex;width:100%;background:transparent;border-color:rgba(250,199,117,.45);box-shadow:none}
.menu .units button{flex:1;color:var(--sun)}
.menu .units button[aria-pressed=true]{background:var(--sun);color:var(--ink)}
.menu .spacer{flex:1}
.menu .connect{width:100%;background:transparent;border-color:rgba(250,199,117,.55);color:var(--sun);box-shadow:none}
.menu .why{font-size:13px;color:#C9B492;margin:10px 0 0;text-align:center;line-height:1.35}
.menu input{width:100%;background:rgba(250,199,117,.1);border:2px solid rgba(250,199,117,.5);border-radius:12px;padding:11px 13px;color:var(--sun);outline:none;margin-bottom:10px;font:inherit}
.menu input:focus{border-color:var(--sun)}
.menu input::placeholder{color:#9C8360}
.menu .oubli{background:none;border:0;padding:0;margin-top:12px;width:100%;color:#C9B492;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.menu .acct{font-weight:700;color:var(--paper);font-size:15px;margin:0 0 12px;word-break:break-all}
.menu .msg{font-size:13px;color:var(--leaf);margin:10px 0 0;line-height:1.35}
.menu .msg.bad{color:var(--coral)}
.weeks{list-style:none;padding:0;margin:26px auto 0;max-width:640px;display:grid;gap:12px}
.cal{margin-top:26px;overflow-x:auto}
.cal table{border-collapse:separate;border-spacing:8px;width:100%;min-width:680px}
.cal th{font-family:var(--display);font-weight:800;font-size:15px;padding-bottom:2px}
.cal th.corner{width:64px}
.cal td.hour{font-weight:700;font-size:14px;text-align:right;width:64px;color:var(--ink-soft)}
.cal td.slot{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:14px;padding:8px;vertical-align:top;height:112px}
.cal td.slot.vide{background:transparent;border-style:dashed;opacity:.55}
.cal td.slot img{width:100%;height:46px;object-fit:cover;border-radius:8px;border:2px solid var(--ink);display:block;margin-bottom:6px}
.cal td.slot b{display:block;font-weight:600;font-size:13.5px;line-height:1.2}
.cal td.slot small{color:var(--ink-soft);font-size:12px}
.cal td.slot.reste b::before{content:'♻ '}
.vues{display:flex;justify-content:center;gap:10px;margin-top:22px}
.weeks li{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.weeks .plats{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.weeks .plats span{background:var(--sun);border:2px solid var(--ink);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.prefs-row{display:flex;justify-content:center;margin-top:18px}
.menu .mini{display:flex;gap:8px;margin-top:4px}
.menu .mini button{flex:1;font-size:13.5px;padding:9px 8px}
.weeks b{font-weight:700}
.weeks small{display:block;color:var(--ink-soft);font-size:13.5px}
.menu .close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:transparent;border:2px solid rgba(250,199,117,.5);color:var(--sun);font-size:16px;line-height:1;padding:0}
.home{margin-right:auto;width:44px;height:44px;border-radius:50%;background:var(--paper);border:var(--bw) solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:none;align-items:center;justify-content:center;padding:0}
.home.on{display:flex}
.home svg{width:22px;height:22px}
.units{display:inline-flex;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:999px;padding:3px;box-shadow:2px 2px 0 var(--ink)}
.units button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.units button[aria-pressed=true]{background:var(--ink);color:var(--sun)}
/* leftovers switch */
.switch{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px 16px;margin-top:18px;cursor:pointer;box-shadow:var(--shadow)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:0 0 58px;width:58px;height:32px;box-sizing:border-box;border-radius:99px;background:var(--paper);border:var(--bw) solid var(--ink);position:relative;transition:background .15s}
.track::after{content:'';position:absolute;top:50%;left:4px;width:19px;height:19px;border-radius:50%;background:var(--ink);transform:translateY(-50%);transition:transform .15s}
.switch input:checked + .track{background:var(--leaf)}
.switch input:checked + .track::after{transform:translate(26px,-50%)}
.switch input:focus-visible + .track{outline:3px solid var(--ink);outline-offset:3px}
.switch b{display:block;font-size:16px}
.switch small{display:block;color:var(--ink-soft);font-size:14px;font-weight:500}
/* nutrition + leftovers + tools */
.nutri{text-align:center;font-weight:600;margin:14px auto 0;max-width:520px}
.pill.k{background:var(--sky)}.pill.p{background:var(--pink)}
.card.leftover .photo img{filter:saturate(.6)}
.leftover-tag{position:absolute;top:12px;left:12px;background:var(--leaf);border:var(--bw) solid var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;z-index:2;box-shadow:2px 2px 0 var(--ink)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
/* the plan screen sits above the fixed bottom bar: keep its last row clear of it */
#ecranPlan .tools{margin-bottom:calc(130px + env(safe-area-inset-bottom))}
.btn-sm{padding:10px 16px;font-size:15px;border-radius:12px}
#btnTelegram{text-decoration:none;color:inherit}
#btnTelegram[hidden]{display:none}
/* more preferences */
.more{max-width:560px;margin:44px auto 0;border-top:0;padding-top:0}
.more>summary{list-style:none;cursor:pointer;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:'+';font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.more[open]>summary::after{content:'–'}
.more>summary b{font-family:var(--display);font-size:20px;font-weight:800;display:block}
.more>summary small{color:var(--ink-soft);font-size:14px}
.more .block:first-of-type{margin-top:34px}
.more .block{margin-top:36px}
.stepper.solo{max-width:240px;margin:0 auto;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
.chips.equip .chip[aria-pressed=true]{background:var(--sky)}
.chips.nutri .chip[aria-pressed=true]{background:var(--pink)}
.chips.level .chip[aria-pressed=true]{background:var(--lilac)}
.hidden{display:none!important}
.pill.t{background:var(--paper)}
/* ---------- desktop ---------- */
@media (min-width:900px){
  .wrap{max-width:900px;padding:18px 36px 80px}
  .topbar{max-width:none;padding:14px 20px 0;justify-content:flex-start}
  h1{font-size:clamp(34px,2.9vw,46px)}
  .dock-inner{max-width:900px}
  /* everything reads from the left edge, like a settings page */
  #ecranForm.on>header h1{max-width:none}
  /* form: full-height rail on the right, like a basket */
  body[data-ecran=ecranForm]{padding-right:440px}
  body[data-ecran=ecranForm] #resume{display:block;position:fixed;top:0;right:0;bottom:0;width:440px;overflow-y:auto;
    background:var(--ink);border-left:var(--bw) solid var(--ink);padding:34px 34px calc(34px + env(safe-area-inset-bottom));z-index:9}
  .wrap{margin:0 auto}
  #ecranForm.on>header .lede{font-size:18px;max-width:46ch}
  .block,.more,.more>summary{max-width:none}
  /* label left, control right — no more centred blocks with holes */
  .block{text-align:left;display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:8px 24px;align-items:start;margin-top:22px;padding-top:20px;border-top:2px dashed rgba(59,31,6,.22)}
  .block:first-of-type{border-top:0;padding-top:4px}
  .lab-col{grid-column:1;grid-row:1;align-self:start;padding-top:2px}
  .lab-col h3{font-size:18px;margin:0}
  .lab-col .sub{margin:3px 0 0;font-size:13.5px;line-height:1.35}
  .block>*:not(.lab-col){grid-column:2}
  .duo{grid-template-columns:auto minmax(0,1fr);gap:16px}
  .panel{padding:12px 16px}
  .panel .lab{margin-bottom:6px}
  .stepper{gap:12px}
  .stepper button{width:38px;height:38px;font-size:20px}
  .stepper output{font-size:30px}
  .big{font-size:30px}
  input[type=range]{margin:10px 0 4px}
  .chip{padding:7px 14px;font-size:14.5px}
  .slots{padding:14px}
  .slot{height:34px}
  .switch{padding:12px 14px;margin-top:10px}
  .more{margin-top:26px}
  .more>summary{padding:14px 18px}
  textarea{min-height:70px}
  .chips{justify-content:center}
  .block>*:not(.lab-col){justify-self:center;width:100%;max-width:640px}
  .stepper.solo{margin:0 auto}
  .slots{padding:18px}
  .switch{margin-top:12px}
  .stepper.solo{margin:0}
  body[data-ecran=ecranForm] .dock{display:none}
  /* the whole week at a glance instead of a carousel */
  .rail-wrap{margin:30px 0 0}
  .rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;overflow:visible;padding:6px 0 4px}
  .card{flex:none;width:auto}
  .rail-nav{display:none}
  .week{margin-top:30px}
  /* shopping list on two columns */
  #aisles{column-count:2;column-gap:34px}
  .aisle{break-inside:avoid;-webkit-column-break-inside:avoid;margin-top:0;margin-bottom:30px;display:inline-block;width:100%}
  .tools,.list-actions{margin-top:28px}
  .cal{grid-template-columns:repeat(4,minmax(0,1fr))}
  #ecranForm.on>header{margin-bottom:10px}
  .suggest{grid-column:2;display:flex;align-items:center;gap:10px;background:rgba(255,248,236,.75);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600}
  .suggest button{border:2px solid var(--ink);background:var(--leaf);border-radius:99px;padding:4px 12px;font-weight:700;font-size:13.5px}
}
.suggest{display:flex;align-items:center;gap:10px;background:rgba(255,248,236,.75);border:2px dashed var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:12px;text-align:left}
.suggest button{border:2px solid var(--ink);background:var(--leaf);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13.5px;flex:0 0 auto}
.suggest.hidden{display:none}
.connect{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
#resume .connect{width:100%;margin-top:10px;background:transparent;border-color:rgba(250,199,117,.55);color:var(--sun);box-shadow:none}
#resume{display:none}
@media (min-width:900px){
  #resume .box{background:transparent;color:var(--sun);padding:0}
  #resume h3{font-size:20px;color:var(--sun);margin:0 0 4px}
  #resume .num{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;color:var(--paper);margin-bottom:6px}
  #resume .line{display:flex;justify-content:space-between;gap:16px;font-size:14.5px;color:#E9D9BE;padding:10px 0;border-bottom:1px dashed rgba(250,199,117,.35)}
  #resume .line:last-of-type{border-bottom:0}
  #resume .line b{color:var(--paper);font-weight:600;text-align:right}
  #resume .tags-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  #resume .tg{background:rgba(250,199,117,.16);border:1.5px solid rgba(250,199,117,.5);color:var(--sun);border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:600}
  #resume .btn{width:100%;margin-top:18px;background:var(--sun);color:var(--ink);box-shadow:3px 3px 0 #1C0F03}
  #resume .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px auto 0;max-width:330px;justify-items:center}
  #resume .shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid rgba(250,199,117,.45);display:block}
  #resume .cap{font-size:12.5px;color:#C9B492;margin:8px 0 0;text-align:center}
  #resume .sep{height:1px;background:rgba(250,199,117,.25);margin:26px 0 18px}
  #resume .why{font-size:13px;color:#C9B492;margin:8px 0 0;text-align:center;line-height:1.35}
  #resume .note{font-size:12.5px;color:#C9B492;margin:10px 0 0;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .duo{grid-template-columns:1fr}
  .slots{grid-template-columns:48px repeat(7,minmax(0,1fr));gap:4px;padding:10px}
  .slot{height:36px}
}
</style>
</head>
<body>
<div class="topbar">
  <button type="button" class="burger" id="btnMenu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
  <button type="button" class="home" id="btnAccueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <div class="backdrop" id="backdrop"></div>
  <nav class="menu" id="menu" aria-label="Menu">
    <button type="button" class="close" id="btnFermerMenu" aria-label="✕">✕</button>
    <div class="brand"><img src="/icon-192.png" alt="" onerror="this.remove()"><b data-i18n="brand"></b></div>
    <p class="mlab" data-i18n="m_lang"></p>
    <div class="units" role="group">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
    </div>
    <p class="mlab" data-i18n="m_units"></p>
    <div class="units" role="group">
      <button type="button" data-u="metric" aria-pressed="true" data-i18n="metric">Metric</button>
      <button type="button" data-u="us" aria-pressed="false">US</button>
    </div>
    <div class="spacer"></div>
    <div id="authBox"></div>
  </nav>
</div>

<!-- ============ 1. INTAKE ============ -->
<main class="wrap screen on" id="ecranForm">
  <header class="center">
    <h1 data-i18n="hero_t"></h1>
    <p class="lede" data-i18n="hero_s"></p>
  </header>

  <section class="block">
    <h3 data-i18n="who_t"></h3>
    <p class="sub" data-i18n="who_s"></p>
    <div class="duo">
      <div class="panel">
        <span class="lab" id="lblPeople" data-i18n="people"></span>
        <div class="stepper" role="group" aria-labelledby="lblPeople">
          <button type="button" id="moins" aria-label="−">−</button>
          <output id="people" aria-live="polite">2</output>
          <button type="button" id="plus" aria-label="+">+</button>
        </div>
      </div>
      <div class="panel">
        <label class="lab" for="budget" data-i18n="budget_l"></label>
        <div class="big"><span id="budgetVal">€60</span> <small data-i18n="per_week"></small></div>
        <input type="range" id="budget" min="20" max="300" step="5" value="60">
        <span class="per-meal" id="perMeal"></span>
      </div>
    </div>
  </section>

  <section class="block">
    <h3 data-i18n="meals_t"></h3>
    <p class="sub" data-i18n="meals_s"></p>
    <div class="slots" id="slots"></div>
    <div class="slot-tools">
      <button type="button" class="linkbtn" data-preset="soir" data-i18n="dinners_only"></button>
      <button type="button" class="linkbtn" data-preset="all" data-i18n="every_meal"></button>
      <button type="button" class="linkbtn" data-preset="none" data-i18n="clear"></button>
    </div>
    <label class="switch" id="lunchboxRow">
      <input type="checkbox" id="lunchbox">
      <span class="track" aria-hidden="true"></span>
      <span><b data-i18n="box_t"></b><small data-i18n="box_s"></small></span>
    </label>
  </section>

  <section class="block">
    <h3 data-i18n="diet_t"></h3>
    <p class="sub" data-i18n="diet_s"></p>
    <div class="chips" id="diet" data-single="true">
      <button type="button" class="chip" data-v="aucun" aria-pressed="true" data-i18n="d_any"></button>
      <button type="button" class="chip" data-v="vegetarien" aria-pressed="false" data-i18n="d_veg"></button>
      <button type="button" class="chip" data-v="vegan" aria-pressed="false" data-i18n="d_vegan"></button>
      <button type="button" class="chip" data-v="sans_gluten" aria-pressed="false" data-i18n="d_gf"></button>
      <button type="button" class="chip" data-v="sans_lactose" aria-pressed="false" data-i18n="d_df"></button>
    </div>
  </section>

  <section class="block">
    <h3 data-i18n="all_t"></h3>
    <p class="sub" data-i18n="all_s"></p>
    <div class="chips allergy" id="allergies">
      <button type="button" class="chip" data-v="gluten" aria-pressed="false" data-i18n="a_gluten"></button>
      <button type="button" class="chip" data-v="dairy" aria-pressed="false" data-i18n="a_dairy"></button>
      <button type="button" class="chip" data-v="egg" aria-pressed="false" data-i18n="a_egg"></button>
      <button type="button" class="chip" data-v="peanut" aria-pressed="false" data-i18n="a_peanut"></button>
      <button type="button" class="chip" data-v="tree nut" aria-pressed="false" data-i18n="a_nut"></button>
      <button type="button" class="chip" data-v="shellfish" aria-pressed="false" data-i18n="a_shell"></button>
      <button type="button" class="chip" data-v="seafood" aria-pressed="false" data-i18n="a_fish"></button>
      <button type="button" class="chip" data-v="soy" aria-pressed="false" data-i18n="a_soy"></button>
      <button type="button" class="chip" data-v="sesame" aria-pressed="false" data-i18n="a_sesame"></button>
      <button type="button" class="chip" data-v="__autre" aria-pressed="false" aria-controls="allergiesAutresBox" data-i18n="a_other"></button>
    </div>
    <div class="suggest hidden" id="suggestDiet"><span id="suggestTxt"></span><button type="button" id="suggestBtn"></button></div>
    <div class="reveal" id="allergiesAutresBox">
      <div class="tags small" data-tags="allergiesAutres" data-ph="ph_allergy"></div>
    </div>
  </section>

  <section class="block">
    <h3 data-i18n="kit_t"></h3>
    <p class="sub" data-i18n="kit_s"></p>
    <div class="tags" data-tags="stock" data-ph="ph_stock"></div>
    <label class="switch">
      <input type="checkbox" id="frigo">
      <span class="track" aria-hidden="true"></span>
      <span><b data-i18n="fridge_t"></b><small data-i18n="fridge_s"></small></span>
    </label>
  </section>

  <details class="more" id="more">
    <summary><span><b data-i18n="more_t"></b><small data-i18n="more_s"></small></span></summary>

    <section class="block">
      <h3 data-i18n="left_h"></h3>
      <label class="switch">
        <input type="checkbox" id="leftovers">
        <span class="track" aria-hidden="true"></span>
        <span><b data-i18n="left_t"></b><small data-i18n="left_s"></small></span>
      </label>
    </section>

    <section class="block">
      <h3 data-i18n="nut_t"></h3>
      <p class="sub" data-i18n="nut_s"></p>
      <div class="chips nutri" id="nutrition" data-single="true">
        <button type="button" class="chip" data-v="balanced" aria-pressed="true" data-i18n="n_bal"></button>
        <button type="button" class="chip" data-v="protein" aria-pressed="false" data-i18n="n_prot"></button>
        <button type="button" class="chip" data-v="light" aria-pressed="false" data-i18n="n_light"></button>
      </div>
    </section>

    <section class="block">
      <h3 data-i18n="lvl_t"></h3>
      <p class="sub" data-i18n="lvl_s"></p>
      <div class="chips level" id="niveau" data-single="true">
        <button type="button" class="chip" data-v="beginner" aria-pressed="false" data-i18n="l_beg"></button>
        <button type="button" class="chip" data-v="comfortable" aria-pressed="true" data-i18n="l_comf"></button>
        <button type="button" class="chip" data-v="confident" aria-pressed="false" data-i18n="l_conf"></button>
      </div>
    </section>

    <section class="block">
      <h3 data-i18n="eq_t"></h3>
      <p class="sub" data-i18n="eq_s"></p>
      <div class="chips equip" id="equipement">
        <button type="button" class="chip" data-v="oven" aria-pressed="true" data-i18n="e_oven"></button>
        <button type="button" class="chip" data-v="hob" aria-pressed="true" data-i18n="e_hob"></button>
        <button type="button" class="chip" data-v="microwave" aria-pressed="true" data-i18n="e_micro"></button>
        <button type="button" class="chip" data-v="air_fryer" aria-pressed="false" data-i18n="e_air"></button>
        <button type="button" class="chip" data-v="blender" aria-pressed="false" data-i18n="e_blend"></button>
        <button type="button" class="chip" data-v="food_processor" aria-pressed="false" data-i18n="e_proc"></button>
        <button type="button" class="chip" data-v="slow_cooker" aria-pressed="false" data-i18n="e_slow"></button>
        <button type="button" class="chip" data-v="pressure_cooker" aria-pressed="false" data-i18n="e_press"></button>
        <button type="button" class="chip" data-v="rice_cooker" aria-pressed="false" data-i18n="e_rice"></button>
        <button type="button" class="chip" data-v="grill" aria-pressed="false" data-i18n="e_grill"></button>
      </div>
      <div class="tags small" data-tags="equipExtra" data-ph="ph_equip"></div>
    </section>

    <section class="block" id="meatBlock">
      <h3 data-i18n="mf_t"></h3>
      <p class="sub" data-i18n="mf_s"></p>
      <div class="stepper solo" role="group" aria-label="Meat-free days">
        <button type="button" id="mfMoins" aria-label="−">−</button>
        <output id="meatFree" aria-live="polite">0</output>
        <button type="button" id="mfPlus" aria-label="+">+</button>
      </div>
    </section>

    <section class="block">
      <h3 data-i18n="time_t"></h3>
      <p class="sub" data-i18n="time_s"></p>
      <div class="chips time" id="temps" data-single="true">
        <button type="button" class="chip" data-v="20" aria-pressed="false">20 min</button>
        <button type="button" class="chip" data-v="30" aria-pressed="false">30 min</button>
        <button type="button" class="chip" data-v="45" aria-pressed="false">45 min</button>
        <button type="button" class="chip" data-v="0" aria-pressed="true" data-i18n="t_none"></button>
      </div>
    </section>

    <section class="block">
      <h3 data-i18n="cui_t"></h3>
      <p class="sub" data-i18n="cui_s"></p>
      <div class="chips cuisine" id="cuisines">
        <button type="button" class="chip" data-v="italien" aria-pressed="false" data-i18n="c_it"></button>
        <button type="button" class="chip" data-v="asiatique" aria-pressed="false" data-i18n="c_as"></button>
        <button type="button" class="chip" data-v="francais" aria-pressed="false" data-i18n="c_fr"></button>
        <button type="button" class="chip" data-v="mexicain" aria-pressed="false" data-i18n="c_mx"></button>
        <button type="button" class="chip" data-v="moyen_orient" aria-pressed="false" data-i18n="c_me"></button>
        <button type="button" class="chip" data-v="indien" aria-pressed="false" data-i18n="c_in"></button>

      <datalist id="cuisineIdeas">
        <option value="Thai"><option value="Japanese"><option value="Korean"><option value="Chinese"><option value="Vietnamese">
        <option value="Greek"><option value="Spanish"><option value="Mediterranean"><option value="Caribbean"><option value="African">
        <option value="Thaï"><option value="Japonais"><option value="Coréen"><option value="Grec"><option value="Espagnol">
      </datalist>
    </section>

    <section class="block">
      <h3 data-i18n="skip_t"></h3>
      <p class="sub" data-i18n="skip_s"></p>
      <div class="tags" data-tags="exclude" data-ph="ph_skip"></div>
    </section>

    <section class="block">
      <h3 data-i18n="else_t"></h3>
      <p class="sub" data-i18n="else_s"></p>
      <textarea id="notes" data-i18n-ph="ph_notes"></textarea>
    </section>
  </details>

  <div class="prefs-row"><button type="button" class="btn btn-sm hidden" id="btnUtiliserPrefs" data-i18n="use_prefs"></button></div>

  <p class="err" id="formErr" role="alert"></p>

  <aside id="resume"><div class="box" id="resumeBox"></div></aside>
</main>

<!-- ============ 4. SHOPPING LIST ============ -->

  function slotLabel(c) { var p = String(c).split('_'); return t('slot', t('days')[p[0]] || p[0], t('moments')[p[1]] || p[1]); }
  function jour(c) { return t('days')[String(c).split('_')[0]]; }

  // ---------- units ----------
  function frac(x) {
    var w = Math.floor(x), r = Math.round((x - w) * 4) / 4;
    if (r === 1) { w += 1; r = 0; }
    var f = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' }[r];
    return (w ? w : (f ? '' : '0')) + f;
  }
  function nombre(x) { var s = x >= 10 ? String(Math.round(x)) : String(Math.round(x * 10) / 10); return lang === 'fr' ? s.replace('.', ',') : s; }
  function versUS(q, u) {
    u = String(u || '').toLowerCase();
    var g = { g: 1, kg: 1000 }[u], ml = { ml: 1, l: 1000, tsp: 5, tsps: 5, tbsp: 15, tbsps: 15 }[u];
    if (g) { var oz = q * g / 28.35; return oz >= 16 ? frac(oz / 16) + ' lb' : frac(Math.max(oz, 0.25)) + ' oz'; }
    if (ml) {
      var v = q * ml;
      if (v < 15) return frac(Math.max(v / 4.93, 0.25)) + ' tsp';
      if (v < 60) return frac(v / 14.79) + ' tbsp';
      var cups = v / 236.6;
      return cups >= 4 ? frac(cups / 4) + ' qt' : frac(cups) + ' cup' + (cups > 1.1 ? 's' : '');
    }
    return null;
  }
  function qte(q, u) {
    if (!q) return '';
    if (unites === 'us') { var c = versUS(q, u); if (c) return c; }
    var lu = String(u || '').toLowerCase();
    var joli = { tbsps: lang === 'fr' ? 'c. à s.' : 'tbsp', tbsp: lang === 'fr' ? 'c. à s.' : 'tbsp', tsps: lang === 'fr' ? 'c. à c.' : 'tsp', tsp: lang === 'fr' ? 'c. à c.' : 'tsp', servings: '', serving: '' }[lu];
    joli = joli === undefined ? (u || '') : joli;
    return nombre(q) + (joli ? ' ' + joli : '');
  }
  function qteTexte(s) {
    var r = String(s);
    if (unites === 'us') r = r.replace(/(\d+(?:\.\d+)?)\s*(kg|g|ml|L)\b/g, function (m, n, u) { return versUS(Number(n), u) || m; });
    if (lang === 'fr') r = r.replace(/\bpieces?\b/g, 'pièces').replace(/\bcloves\b/g, 'gousses').replace(/(\d)\.(\d)/g, '$1,$2');
    return r;
  }

  // ---------- leftovers rule (same as backend) ----------

  function dejeunerLendemain(c) { var p = c.split('_'), i = JOURS.indexOf(p[0]); return i >= 0 && i < 6 ? JOURS[i + 1] + '_midi' : null; }
  function estReste(c, actif, tous) { return !!actif && /_midi$/.test(c) && tous.indexOf(dinerVeille(c)) !== -1; }

  // ---------- screens ----------

  // Telegram deep link: the bot receives "/start <reference>" and links this chat to the account.

  function majTelegram() {

  function setRef(r) {

  function arreterPolling() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }
  function poll(url, estFini, surFini, surEchec) {
    arreterPolling();
    var n = 0;
    (function tick() {
      n++;
      fetch(url + '?ref=' + encodeURIComponent(ref) + '&t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.statut === 'echec' || d.statut === 'introuvable') { arreterPolling(); surEchec(d.message || t('generic_err')); return; }
          if (estFini(d)) { arreterPolling(); surFini(d); return; }
          suivant();
        })
        .catch(suivant);
      function suivant() {
        if (n >= POLL_MAX) { surEchec(t('long_wait')); return; }
        pollTimer = setTimeout(tick, POLL_MS);
      }
    })();
  }

  function initTags(box) {
    var name = box.dataset.tags;
    tags[name] = [];
    box.innerHTML = '<input type="text" enterkeyhint="done" autocomplete="off"' + (box.dataset.list ? ' list="' + box.dataset.list + '"' : '') + '><button type="button" class="add">+</button>';
    var input = box.querySelector('input');
    function dessiner() {
      input.placeholder = t(box.dataset.ph); input.setAttribute('aria-label', t(box.dataset.ph));
      box.querySelectorAll('.tag').forEach(function (x) { x.remove(); });
      tags[name].forEach(function (v, i) {

        box.insertBefore(s, input);

    redessinerTags[name] = dessiner;
    function ajouter() {
      input.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (v) {
        if (!tags[name].some(function (x) { return x.toLowerCase() === v.toLowerCase(); })) tags[name].push(v);
      });
      input.value = ''; dessiner();
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); ajouter(); }
      else if (e.key === 'Backspace' && !input.value && tags[name].length) { tags[name].pop(); dessiner(); }
    });
    input.addEventListener('change', function () { if (box.dataset.list && input.value) ajouter(); });
    input.addEventListener('blur', function () { if (input.value.trim()) ajouter(); });
    box.addEventListener('click', function (e) {
      var rm = e.target.closest('[data-i]');

      '<input type="password" id="authPass" autocomplete="' + (inscription ? 'new-password' : 'current-password') + '" placeholder="' + esc(t('pw_ph')) + '">' +
      '<button type="button" class="connect" id="btnAuth">' + t(inscription ? 'sign_up' : 'sign_in') + '</button>' +
      '<button type="button" class="linkbtn" id="btnBascule" style="color:var(--sun);margin-top:12px;width:100%">' + t(inscription ? 'have_account' : 'no_account') + '</button>' +
      (inscription ? '' : '<button type="button" class="oubli" id="btnOubli">' + t('forgot') + '</button>') +
      (message ? '<p class="msg' + (erreur ? ' bad' : '') + '">' + esc(message) + '</p>' : '<p class="why">' + t('why_login') + '</p>');
    $('btnBascule').onclick = function () { inscription = !inscription; rendreAuth(); };
    if ($('btnOubli')) $('btnOubli').onclick = function () {
      var email = ($('authEmail').value || '').trim();
      if (!email || email.indexOf('@') === -1) { rendreAuth(t('auth_bad'), true); return; }
      try {
        sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin })
          .then(function (r) {
            // supabase-js resolves with { error } instead of rejecting: without this check a failed send still said "sent".
            if (r && r.error) {
              console.error('resetPasswordForEmail:', r.error);
              var m = String(r.error.message || '');
              rendreAuth(/rate|seconds|too many/i.test(m) ? t('auth_err') + ' (' + m + ')' : t('auth_err') + (m ? ' (' + m + ')' : ''), true);
              return;
            }
            rendreAuth(t('reset_sent'));
          }, function () { rendreAuth(t('auth_err'), true); });
      } catch (e) { rendreAuth(t('auth_err'), true); }
    };
    $('authPass').onkeydown = function (e) { if (e.key === 'Enter') $('btnAuth').click(); };
    $('btnAuth').onclick = function () {
      var email = ($('authEmail').value || '').trim(), pass = $('authPass').value || '';
      if (!email || email.indexOf('@') === -1) { rendreAuth(t('auth_bad'), true); return; }
      if (pass.length < 6) { rendreAuth(t('err_weak'), true); return; }
      $('btnAuth').disabled = true; $('btnAuth').textContent = t('sending');
      var appel = inscription
        ? sb.auth.signUp({ email: email, password: pass, options: { emailRedirectTo: window.location.origin } })
        : sb.auth.signInWithPassword({ email: email, password: pass });
      appel.then(function (r) {
        if (!r.error) {
          // Sign-up with email confirmation on: no session yet, the user must confirm first.
          if (inscription && !(r.data && r.data.session)) { inscription = false; rendreAuth(t('check_mail')); }
          return;
        }
        var m = String(r.error.message || '').toLowerCase();
        if (m.indexOf('already') !== -1 || m.indexOf('registered') !== -1) { inscription = false; rendreAuth(t('err_exists'), true); }
        else if (m.indexOf('password') !== -1 && m.indexOf('short') !== -1) rendreAuth(t('err_weak'), true);
        else rendreAuth(t('err_creds'), true);
      }, function () { rendreAuth(t('err_creds'), true); });
    };
  }

  // ---------- plan ----------
  function montrerPlan(d) {

  function toutesLesCases() {

      var pa = a.split('_'), pb = b.split('_');
      return (JOURS.indexOf(pa[0]) * 2 + (pa[1] === 'soir')) - (JOURS.indexOf(pb[0]) * 2 + (pb[1] === 'soir'));
    });
    return ordre.map(function (c) { return { creneau: c, repas: par[c] || null }; });
  }
  function parSlotRepas() { var m = {}; plan.repas.forEach(function (r) { m[r.creneau] = r; }); return m; }
  function rejeteEffectif(c) {

  }
  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_UNDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-2"/></svg>';

  function rendrePlan() {
    var cases = toutesLesCases();

  var vue = 'cartes';

  // ---------- shopping list ----------
  function ouvrirListe() {
    if (listeAJour && liste) { montrerListe(liste); return; }
    attente('w_list');
    var suite = function () { poll(URL_COURSES, function (d) { return d.statut === 'prete'; }, function (d) { liste = d; listeAJour = true; montrerListe(d); }, erreur); };
    if (listeAJour) { suite(); return; }
    fetch(URL_VALIDER, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reference: ref }) })
      .then(function (r) { return r.json(); })

      .catch(function () { erreur(t('err_try')); });

  function montrerListe(d) {
    var coches = {};

    var aAcheter = d.courses.filter(function (c) { return c.a_acheter; });
    var dejaLa = d.courses.filter(function (c) { return !c.a_acheter; });
    $('listSum').textContent = t('list_sum', aAcheter.length, euros(d.cout_total));
    var h = '';
    RAYONS.forEach(function (ry) {
      var items = aAcheter.filter(function (c) { return (c.rayon || 'autre') === ry; });

        h += '<li class="' + (on ? 'done' : '') + '"><input type="checkbox" data-k="' + esc(k) + '"' + (on ? ' checked' : '') + ' aria-label="' + esc(c.ingredient) + '">' +

  function texteListe() {
    return RAYONS.map(function (ry) {
      var items = liste.courses.filter(function (c) { return c.a_acheter && (c.rayon || 'autre') === ry; });
      return items.length ? t('aisles')[ry] + '\n' + items.map(function (c) { return '- ' + c.ingredient + ' (' + qteTexte(c.quantite) + ')'; }).join('\n') : '';
    }).filter(Boolean).join('\n\n');
  }
  function partager(bouton, donnees, texteCopie) {
    var orig = bouton.textContent;
    function dire(x) { bouton.textContent = x; setTimeout(function () { bouton.textContent = orig; }, 1800); }
    if (navigator.share) { navigator.share(donnees).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(texteCopie) : Promise.reject()).then(function () { dire(t('copied')); }, function () { dire(t('cant_copy')); });
  }
  function calendrier() {
    var d = new Date(); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + (8 - d.getDay()) % 7);
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function stamp(dt, h, m) { return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + 'T' + pad(h) + pad(m) + '00'; }
    function txt(s) { return String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n'); }
    var ev = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Meal planner//EN', 'CALSCALE:GREGORIAN'];
    plan.repas.forEach(function (r) {
      var p = r.creneau.split('_'), j = new Date(d); j.setDate(d.getDate() + JOURS.indexOf(p[0]));
      var h = p[1] === 'midi' ? 12 : 19;
      ev.push('BEGIN:VEVENT', 'UID:' + ref + '-' + r.creneau + '@meal-planner', 'DTSTAMP:' + stamp(new Date(), 0, 0) + 'Z',
        'DTSTART:' + stamp(j, h, 30), 'DTEND:' + stamp(j, h + 1, 15),
        'SUMMARY:' + txt((p[1] === 'midi' ? t('cal_l') : t('cal_d')) + r.plat), 'DESCRIPTION:' + txt((r.pourquoi || '') + (r.lien ? '\n' + r.lien : '')), 'END:VEVENT');
    });
    ev.push('END:VCALENDAR');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ev.join('\r\n')], { type: 'text/calendar' }));
    a.download = 'meal-plan.ics';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function recommencer() {
    arreterPolling();
    document.querySelectorAll('.submit').forEach(function (x) { x.disabled = false; x.textContent = t('plan_btn'); });
    setRef(null); plan = null; liste = null; listeAJour = false; rejetes = {};
    afficher('ecranForm');
  }

  // ---------- wiring ----------
  initChips('diet', majViande); initChips('cuisines'); initChips('temps');
  initChips('nutrition'); initChips('niveau'); initChips('equipement');
  initChips('allergies', function (b) {
    if (b.dataset.v === '__autre') {
      var on = b.getAttribute('aria-pressed') === 'true';
      $('allergiesAutresBox').classList.toggle('on', on);
      if (on) $('allergiesAutresBox').querySelector('input').focus();
    }
  });
  // Desktop puts the title and its hint in a left column; wrap them once here.
  document.querySelectorAll('.block').forEach(function (bl) {
    var h3 = bl.querySelector(':scope>h3'), sub = bl.querySelector(':scope>.sub');
    if (!h3) return;
    var col = document.createElement('div');
    col.className = 'lab-col';
    bl.insertBefore(col, h3);
    col.appendChild(h3); if (sub) col.appendChild(sub);
  });
  document.querySelectorAll('[data-tags]').forEach(initTags);
  dessinerSlots();
  $('slots').addEventListener('click', function (e) {
    var b = e.target.closest('.slot'); if (!b) return;
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    majResume();
  });
  document.querySelectorAll('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.dataset.preset;
      $('slots').querySelectorAll('.slot').forEach(function (s) { s.setAttribute('aria-pressed', String(p === 'all' || (p === 'soir' && /_soir$/.test(s.dataset.v)))); });
      majResume();
    });
  });
  $('moins').onclick = function () { $('people').textContent = Math.max(1, personnes() - 1); majResume(); };
  $('plus').onclick = function () { $('people').textContent = Math.min(12, personnes() + 1); majResume(); };
  $('mfMoins').onclick = function () { $('meatFree').textContent = Math.max(0, (Number($('meatFree').textContent) || 0) - 1); };
  $('mfPlus').onclick = function () { $('meatFree').textContent = Math.min(7, (Number($('meatFree').textContent) || 0) + 1); };
  $('budget').addEventListener('input', majResume);
  $('leftovers').addEventListener('change', majResume);
  ['lunchbox','frigo','meatFree','diet','nutrition','niveau','temps','cuisines','allergies','equipement'].forEach(function (id) {
    var el = $(id); if (el) el.addEventListener('click', function () { setTimeout(majResume, 0); });
  });
  $('mfPlus').addEventListener('click', majResume);
  $('mfMoins').addEventListener('click', majResume);

  $('rail').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rej]'); if (!b) return;
    var c = b.dataset.rej;
    if (rejetes[c]) delete rejetes[c]; else rejetes[c] = true;
    var x = $('rail').scrollLeft; rendrePlan(); $('rail').scrollLeft = x;
  });
  $('rail').addEventListener('scroll', function () { window.requestAnimationFrame(majCompteur); }, { passive: true });
  $('week').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (!b) return;
    var card = $('c-' + b.dataset.go);
    if (card) $('rail').scrollTo({ left: card.offsetLeft - 20, behavior: 'smooth' });
  });
  function pas(dir) { var card = $('rail').querySelector('.card'); if (card) $('rail').scrollBy({ left: dir * (card.getBoundingClientRect().width + 18), behavior: 'smooth' }); }
  $('vueCartes').onclick = function () { vue = 'cartes'; majVue(); };
  $('vueCal').onclick = function () { vue = 'calendrier'; majVue(); };
  $('prev').onclick = function () { pas(-1); };
  $('next').onclick = function () { pas(1); };

  $('btnRetour').onclick = function () { if (plan) { rendrePlan(); afficher('ecranPlan'); } else recommencer(); };
  $('btnErreurPlan').onclick = function () { if (plan) { rendrePlan(); afficher('ecranPlan'); } };
  $('btnErreurReset').onclick = recommencer;
  $('btnNouveau').onclick = recommencer;
  $('btnNouveau2').onclick = recommencer;
  $('weeksList').addEventListener('click', function (e) {
    var ouvre = e.target.closest('[data-ref]'), courses = e.target.closest('[data-courses]');
    if (!ouvre && !courses) return;
    setRef(ouvre ? ouvre.dataset.ref : courses.dataset.courses);
    plan = null; liste = null; listeAJour = false;
    if (ouvre) { attendrePlan(); return; }
    // Straight to that week's shopping list: it already exists, we only read it.
    attente('w_list');
    listeAJour = true;
    poll(URL_COURSES, function (d) { return d.statut === 'prete'; },
      function (d) { liste = d; montrerListe(d); },
      function () { listeAJour = false; attendrePlan(); });
  });
  $('btnCopier').onclick = function () { if (liste) partager($('btnCopier'), { title: t('list_title'), text: t('list_title') + '\n\n' + texteListe() }, texteListe()); };
  $('btnPartagerPlan').onclick = function () { var u = window.location.href; partager($('btnPartagerPlan'), { title: t('plan_t'), text: t('plan_share'), url: u }, u); };
  $('btnCalendrier').onclick = calendrier;
  // Open the bot in a new tab so the plan stays open behind it.
  $('btnTelegram').onclick = function (e) {
    var href = $('btnTelegram').href; if (!href) return;
    e.preventDefault();
    window.open(href, '_blank', 'noopener');
  };
  // Home: back to the form without leaving the site. The current plan stays reachable by its link.
  $('btnAccueil').onclick = recommencer;
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.onclick = function () { lang = b.dataset.lang; try { localStorage.setItem('mp-lang', lang); } catch (e) {} appliquerLangue(); };
  });
  document.querySelectorAll('[data-u]').forEach(function (b) {
    b.onclick = function () { unites = b.dataset.u; try { localStorage.setItem('mp-unites', unites); } catch (e) {} majUnites(); };
  });

  function menu(on) {
    $('menu').classList.toggle('on', on);
    $('backdrop').classList.toggle('on', on);
    $('btnMenu').setAttribute('aria-expanded', String(on));
  }
  $('btnMenu').onclick = function () { menu(!$('menu').classList.contains('on')); };
  $('btnFermerMenu').onclick = function () { menu(false); };
  $('backdrop').onclick = function () { menu(false); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') menu(false); });
  chargerPrefs();
  appliquerLangue();
  if (sb) {
    var hash = window.location.hash || '';
    if (hash.indexOf('error') !== -1) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
      setTimeout(function () { rendreAuth(t('link_dead'), true); menu(true); }, 300);
    }
    rendreAuth();
    sb.auth.getSession().then(function (r) { appliquerSession((r.data || {}).session); });
    sb.auth.onAuthStateChange(function (ev, s) {
      if (ev === 'PASSWORD_RECOVERY') { recuperation = true; session = s || session; rendreAuth(); menu(true); return; }
      appliquerSession(s);
    });
  }
  $('btnUtiliserPrefs').onclick = utiliserPrefs;
  majBoutonPrefs();
  majUnites();
  majViande();
  afficher('ecranForm');
  var r0 = new URL(window.location.href).searchParams.get('ref');
  if (r0) { ref = r0; attendrePlan(); }
})();
</script>
</body>
</html>
